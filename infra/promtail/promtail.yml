server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape every Docker container's stdout/stderr. Apps log structured JSON
  # via pino; we keep the raw line and pipe a few fields (level, msg) as Loki
  # labels for cheaper filtering.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      # Try parsing as JSON; if it isn't, we keep the original line.
      - json:
          expressions:
            level: level
            msg:   msg
      - labels:
          level:
