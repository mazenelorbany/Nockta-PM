global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nockta-api
    static_configs:
      - targets: ["host.docker.internal:3000"]
    metrics_path: /metrics

  - job_name: nockta-workers
    static_configs:
      - targets: ["host.docker.internal:3002"]
    metrics_path: /metrics
