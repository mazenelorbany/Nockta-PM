server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ===========================================================================
  # Security headers. Applied via `add_header always` so they're present on
  # error responses too (4xx / 5xx), which is where forgetting CSP usually
  # bites. The SPA stores its JWT in localStorage; without CSP a single XSS
  # in the app would exfiltrate that token. CSP is the principal defence.
  #
  # connect-src uses the broad `https:` and `wss:` because the API URL is
  # passed in at build time and isn't readable from this nginx config. If
  # you want to lock that down further, swap to envsubst at container boot
  # and inject the exact API origin.
  # ===========================================================================
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

  # Health probe — Railway's healthcheck pings this; respond fast without
  # touching the static-files pipeline.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # SPA: route every URL to index.html so React Router can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long cache for static assets — they're content-hashed by Vite.
  location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Don't cache the HTML shell — we want users to pick up new bundles immediately.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;
}
