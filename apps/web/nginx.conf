server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Health probe — Railway's healthcheck pings this; respond fast without
  # touching the static-files pipeline.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # SPA: route every URL to index.html so React Router can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long cache for static assets — they're content-hashed by Vite.
  location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Don't cache the HTML shell — we want users to pick up new bundles immediately.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;
}
