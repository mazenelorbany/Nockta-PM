server {
  # Listen on the port Railway injects (defaults to 80 for local docker run).
  # The Dockerfile substitutes ${PORT} at container startup so this works
  # for both Railway (which routes its public URL to whatever port the
  # container binds) and stand-alone `docker run -p 8080:80 …` flows.
  # The IPv6 listen is required because Railway's internal healthcheck
  # prober resolves the container over IPv6.
  listen ${PORT};
  listen [::]:${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ===========================================================================
  # Security headers. nginx has a sharp edge here: any `add_header` directive
  # inside a `location` block silently drops every parent-scope `add_header`.
  # That means putting CSP at the server level alongside a per-location
  # `Cache-Control` would ship pages without CSP. Workaround: keep the
  # security headers in a single include file and `include` it inside every
  # location that owns its own `add_header`.
  # ===========================================================================

  # Health probe — Railway's healthcheck pings this; respond fast without
  # touching the static-files pipeline.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    include /etc/nginx/snippets/security-headers.conf;
    return 200 "ok\n";
  }

  # Long cache for static assets — they're content-hashed by Vite.
  location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Don't cache the HTML shell — we want users to pick up new bundles immediately.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/snippets/security-headers.conf;
    expires 0;
  }

  # SPA: route every URL to index.html so React Router can take over.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;
}
