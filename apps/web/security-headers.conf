# =============================================================================
# Security headers applied to every SPA response. The Dockerfile copies this
# file to /etc/nginx/snippets/security-headers.conf; nginx.conf includes it
# in every location block because nginx drops parent-scope `add_header`
# directives the moment a child location declares its own. `always` makes
# them apply to error responses too — without it, a 404 ships without CSP.
#
# Tuning notes:
#   - script-src is `'self'` only. The SPA bundle is self-served by nginx,
#     so no external CDN scripts are allowed. Inline scripts are blocked.
#   - style-src needs `'unsafe-inline'` because Tailwind and several
#     component libraries inject inline styles for hover/animation states.
#   - connect-src is `https:` and `wss:` because the API origin is a
#     build-time variable on the SPA and isn't readable from here. To
#     tighten further, swap to envsubst at container boot and inject the
#     exact API origin.
#   - frame-ancestors 'none' + X-Frame-Options DENY is belt-and-braces
#     against clickjacking; modern browsers honour the former.
# =============================================================================
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
